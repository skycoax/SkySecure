// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://developer.huawei.com/repo/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.1'
        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.huawei.agconnect:agcp:1.9.1.301'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20"
    }
}
repositories {
    google()
}

// ---------------------------------------------------------------------------
// SkySecure: build one CPU architecture instead of four while developing.
// ---------------------------------------------------------------------------
//
//     ./gradlew :TMessagesProj_App:assembleAfatDebug -PjacAbi=arm64
//
// A debug APK carries armeabi-v7a, arm64-v8a, x86 and x86_64, and libtmessages
// alone is ~52 MB in each — about 120 MB of APK, three quarters of which the
// device you are testing on cannot execute. You pay for the dead weight twice:
// once while Gradle strips and packages it, and again while adb pushes it over
// the cable. Cutting to the one architecture that phone actually runs takes the
// APK to roughly 65 MB and takes the install with it.
//
// Values:
//
//     arm64   every phone since about 2017 — the normal choice
//     arm32   genuinely old hardware
//     x86_64  most emulators, including MEmu
//     all     the default, and what a release MUST ship
//
// Pass nothing and nothing changes.
ext.jacAbiFilters = {
    def requested = project.hasProperty('jacAbi') ? project.property('jacAbi').toString() : 'all'
    switch (requested) {
        case 'arm64':  return ['arm64-v8a']
        case 'arm32':  return ['armeabi-v7a']
        case 'x86_64': return ['x86_64']
        case 'all':    return ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
        default:
            throw new GradleException(
                    "Unknown -PjacAbi=${requested}. Use arm64, arm32, x86_64, or all.")
    }
}

// The flag applies to every build type, release included — abiFilters lives in
// defaultConfig and in the afat flavor, not in a debug-only block. So a release
// built with the flag still set silently ships one architecture: it installs
// perfectly on the phone you tested with, and on nobody else's. Nothing about
// the APK looks wrong, and the way you find out is that installs fail for
// strangers.
//
// A convenience flag that can only cost you a bad release when you forget to
// remove it is not worth having, so forgetting is made impossible instead.
gradle.taskGraph.whenReady { graph ->
    def requested = project.hasProperty('jacAbi') ? project.property('jacAbi').toString() : 'all'
    if (requested == 'all') {
        return
    }
    // Matching 'release' and 'standalone' only, and deliberately NOT 'bundle':
    // a debug graph contains :TMessagesProj:bundleLibCompileToJarDebug and
    // bundleLibRuntimeToJarDebug, which are library-internal jar packaging and
    // have nothing to do with an app bundle. Including 'bundle' here made every
    // debug build fail. An AAB is caught anyway — bundleAfatRelease contains
    // 'release'.
    def releasing = graph.allTasks.any { task ->
        def name = task.name.toLowerCase()
        name.contains('release') || name.contains('standalone')
    }
    if (releasing) {
        throw new GradleException(
                "-PjacAbi=${requested} is a development flag and this is a release build.\n" +
                "A release must carry every architecture. Drop the flag, or pass -PjacAbi=all\n" +
                "if you are deliberately building a single-architecture package.")
    }
}

// ---------------------------------------------------------------------------
// Humogram: a release build runs the store-readiness checks first.
// ---------------------------------------------------------------------------
//
// Tools/play_policy_check.py holds every Play rejection this app has had —
// impersonation, restricted permissions, a content rating the code had
// outgrown, and the target API and Billing Library minimums Google raises each
// 31 August. It was run by hand "before tagging", which is how 69929 went to
// testers with Billing 7 and the 2026 deadline passed without the check
// knowing about it. So a release graph runs it, and a failure stops the build.
// Warnings (a deadline coming up) print and let the build through.
//
// Matching 'release' only, for the reason given above: 'bundle' also names
// library-internal jar tasks in a debug graph. Standalone builds skip it; they
// are not uploaded to Play.
gradle.taskGraph.whenReady { graph ->
    def releasing = graph.allTasks.any { task -> task.name.toLowerCase().contains('release') }
    if (!releasing) {
        return
    }
    def script = new File(rootDir, 'Tools/play_policy_check.py')
    Integer exit = null
    for (python in ['python', 'python3', 'py']) {
        try {
            def process = new ProcessBuilder(python, script.absolutePath)
                    .directory(rootDir)
                    .redirectErrorStream(true)
                    .start()
            process.inputStream.eachLine { println it }
            exit = process.waitFor()
        } catch (IOException ignored) {
            continue // not on PATH under this name
        }
        // 9009 is Windows' "python" alias that only opens the Microsoft Store.
        if (exit != 9009) {
            break
        }
        exit = null
    }
    if (exit == null) {
        throw new GradleException(
                "A release build runs Tools/play_policy_check.py first, and no Python 3 was found\n" +
                "on PATH (tried python, python3, py).")
    }
    if (exit != 0) {
        throw new GradleException(
                "Store-readiness checks failed; the output above names each one.\n" +
                "Fix them, or if Play's own rules changed, update Tools/play_policy_check.py\n" +
                "and docs/play-console.md to match.")
    }
}